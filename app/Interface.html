<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
:root{
  --noturno:#151E49; --royal:#003D7B; --acao:#065CA9;
  --fundo:#F4F6FA; --superficie:#FFFFFF; --superficie2:#EDF1F8;
  --linha:#D6DEEC; --texto:#1B2340; --suave:#5D6883;
  --ok:#1F7A4C; --alerta:#A85B12; --critico:#B03024;
  --sombra:0 1px 2px rgba(21,30,73,.06), 0 8px 24px -14px rgba(21,30,73,.2);
}
*{box-sizing:border-box}
body{
  margin:0; color:var(--texto);
  /* Profundidade em toda a aplicação, não só numa aba: a tela trocava de
     aparência ao mudar de contexto e parecia dois produtos diferentes. */
  background:
    radial-gradient(1100px 560px at 10% -10%, rgba(6,92,169,.13), transparent 60%),
    radial-gradient(900px 520px at 98% 2%,   rgba(21,30,73,.11),  transparent 62%),
    var(--fundo);
  background-attachment:fixed;
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
/* Largura útil maior: a grade comparativa e o formulário são densos e a
   tela larga estava sendo desperdiçada nas laterais. */
.wrap{max-width:1240px;margin:0 auto;padding:0 24px 80px}

/* ── barra de navegação fixa ──
   O vidro vive aqui, no cromo, com o conteúdo passando por baixo. Nunca
   no plano onde se digita dinheiro. */
.barra{
  position:sticky;top:0;z-index:50;margin-bottom:26px;
  background:linear-gradient(180deg, rgba(255,255,255,.82), rgba(255,255,255,.66));
  backdrop-filter:blur(22px) saturate(180%);
  -webkit-backdrop-filter:blur(22px) saturate(180%);
  border-bottom:1px solid rgba(21,30,73,.12);
  box-shadow:0 1px 0 rgba(255,255,255,.85) inset, 0 6px 22px -18px rgba(21,30,73,.5);
}
.barra-in{
  max-width:1240px;margin:0 auto;padding:11px 24px;
  display:flex;align-items:center;gap:22px;
}
.marca{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--suave)}
.marca-nome{font-size:17px;font-weight:700;letter-spacing:-.01em;color:var(--noturno);line-height:1.2}
.barra .abas{margin:0}
.barra #ab-nova{margin-left:auto;white-space:nowrap}

h1{margin:22px 0 0;font-size:27px;letter-spacing:-.02em;color:var(--noturno);font-weight:700}
.sub{margin:5px 0 0;color:var(--suave);font-size:15px}

/* Um anel de foco só, para tudo. Nenhum controle tinha :focus-visible. */
a:focus-visible,button:focus-visible,input:focus-visible,
select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{
  outline:2px solid var(--acao);outline-offset:2px;border-radius:6px;
}

.busca{display:flex;gap:10px;margin:24px 0 8px}
.busca input{
  flex:1;padding:14px 16px;font-size:16px;border:1.5px solid var(--linha);
  border-radius:8px;background:var(--superficie);color:var(--texto);
}
.busca input:focus{outline:none;border-color:var(--acao);box-shadow:0 0 0 3px rgba(6,92,169,.12)}
.busca button{
  padding:14px 24px;font-size:15px;font-weight:600;border:0;border-radius:8px;
  background:var(--royal);color:#fff;cursor:pointer;
}
.busca button:hover{background:var(--acao)}
.busca button:disabled{opacity:.5;cursor:default}

.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:26px}
.chip{
  padding:6px 12px;font-size:13px;border:1px solid var(--linha);border-radius:999px;
  background:var(--superficie);color:var(--royal);cursor:pointer;
}
.chip:hover{border-color:var(--acao);background:var(--superficie2)}

.painel{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:1px;background:var(--linha);border:1px solid var(--linha);
  border-radius:6px;overflow:hidden;margin-bottom:8px;
}
.stat{background:var(--superficie);padding:14px 16px}
.stat b{display:block;font-size:26px;line-height:1.1;color:var(--noturno);font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:12px;color:var(--suave);margin-top:4px}
.periodo{font-size:13px;color:var(--suave);margin:0 0 26px}

.item{
  background:var(--superficie);border:1px solid var(--linha);border-radius:8px;
  padding:18px 20px;margin-bottom:14px;box-shadow:var(--sombra);
}
.item h3{margin:0 0 3px;font-size:17px;color:var(--noturno);font-weight:600}
.item .meta{font-size:12.5px;color:var(--suave);margin-bottom:14px}
.item .cod{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--acao);margin-right:6px}

table{width:100%;border-collapse:collapse}
td{padding:7px 0;border-bottom:1px solid var(--superficie2);font-size:14.5px;vertical-align:middle}
tr:last-child td{border-bottom:0}
td.v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;padding-left:16px}
tr.menor td.v{color:var(--ok)}
tr.maior td.v{color:var(--critico)}
th{text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--suave);padding:0 0 8px;border-bottom:1px solid var(--linha)}
th.c{text-align:center}
th.r{text-align:right}
td.un{text-align:center;font-size:13px;color:var(--suave);white-space:nowrap;padding:0 12px}
.tag{
  display:inline-block;margin-left:8px;padding:1px 7px;border-radius:4px;
  font-size:11px;font-weight:600;vertical-align:1px;
}
.tag.ok{background:#E4F2EA;color:var(--ok)}
.tag.av{background:#FAEEDF;color:var(--alerta)}
.tag.emp{background:#E8EDF5;color:var(--royal)}

.faixa{
  margin-top:12px;padding-top:11px;border-top:1px solid var(--linha);
  font-size:13.5px;color:var(--suave);display:flex;justify-content:space-between;
  align-items:center;gap:12px;flex-wrap:wrap;
}
.faixa .var{font-weight:700}
.var.baixa{color:var(--ok)} .var.media{color:var(--alerta)} .var.alta{color:var(--critico)}

.serie{background:var(--superficie2);border:1px solid var(--linha);border-radius:8px;padding:18px 20px;margin-top:22px}
.serie h2{margin:0 0 12px;font-size:15px;color:var(--noturno);text-transform:uppercase;letter-spacing:.06em}

.aviso{
  background:var(--superficie);border:1px solid var(--linha);border-left:3px solid var(--acao);
  border-radius:0 8px 8px 0;padding:16px 18px;color:var(--suave);font-size:14.5px;
}
.erro{border-left-color:var(--critico);color:var(--critico)}
.carregando{text-align:center;padding:40px;color:var(--suave)}
footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--linha);font-size:12px;color:var(--suave)}
@media(max-width:560px){
  .busca{flex-direction:column}
  h1{font-size:24px}
}
.fonte-link { text-decoration: none; font-size: .85em; opacity: .7; }
.fonte-link:hover { opacity: 1; }
.filtrado { display: block; margin-top: 8px; font-size: 12px; color: var(--suave); }

/* ── navegação entre as duas telas ── */
.abas{
  display:inline-flex;gap:2px;padding:2px;margin:22px 0 4px;
  background:var(--superficie2);border:1px solid var(--linha);border-radius:8px;
}
.abas button{
  padding:8px 18px;font-size:14px;font-weight:600;border:0;border-radius:6px;
  background:transparent;color:var(--suave);cursor:pointer;
}
.abas button[aria-selected="true"]{background:var(--superficie);color:var(--noturno);box-shadow:var(--sombra)}

/* ── mapa de equalização ── */
.eq-sel{display:flex;gap:10px;align-items:center;margin:20px 0 18px;flex-wrap:wrap}
.eq-sel select{
  flex:1;min-width:260px;padding:12px 14px;font-size:15px;border:1.5px solid var(--linha);
  border-radius:8px;background:var(--superficie);color:var(--texto);
}
.eq-cab{
  background:var(--superficie);border:1px solid var(--linha);border-radius:8px;
  padding:16px 20px;margin-bottom:16px;box-shadow:var(--sombra);
}
.eq-cab h2{margin:0 0 4px;font-size:18px;color:var(--noturno);font-weight:600}
.eq-cab .meta{font-size:13px;color:var(--suave)}

/* A matriz rola sozinha: a página nunca rola de lado. */
/* max-height é obrigatório aqui. Com só overflow-x:auto o eixo Y também
   vira 'auto' pela especificação, mas sem altura limitada o container nunca
   rola — e o thead sticky resolve contra um scrollport parado, ou seja,
   nunca gruda. Numa EAP de 40 linhas o comprador perde os nomes das colunas. */
.mapa-rolo{max-height:72vh;overflow:auto;border:1px solid var(--linha);border-radius:8px;background:var(--superficie)}
table.mapa tbody tr:hover td,table.mapa tbody tr:hover .desc{background:#F7F9FD}
table.mapa .desc{box-shadow:1px 0 0 var(--linha)}
table.mapa{border-collapse:separate;border-spacing:0;min-width:100%}
table.mapa th,table.mapa td{padding:9px 14px;border-bottom:1px solid var(--superficie2);white-space:nowrap}
table.mapa thead th{
  position:sticky;top:0;z-index:2;background:var(--noturno);color:#fff;
  font-size:11px;text-transform:uppercase;letter-spacing:.05em;text-align:right;
}
table.mapa thead th small{display:block;font-weight:400;text-transform:none;letter-spacing:0;opacity:.75}
/* A descrição fica fixa à esquerda — sem isso a linha some ao rolar. */
table.mapa .desc{
  position:sticky;left:0;z-index:1;text-align:left;white-space:normal;
  min-width:260px;max-width:380px;background:var(--superficie);
}
table.mapa thead .desc{z-index:3;background:var(--noturno)}
table.mapa tr.grupo td{background:var(--superficie2);font-weight:600;color:var(--noturno)}
table.mapa tr.grupo .desc{background:var(--superficie2)}
table.mapa td.preco{text-align:right;font-variant-numeric:tabular-nums}
table.mapa td.preco.menor{color:var(--ok);font-weight:700}
table.mapa td.preco.vazio{color:var(--linha)}
table.mapa td.preco.nao{color:var(--suave);font-size:12.5px;font-style:italic}
table.mapa tfoot td{
  border-top:2px solid var(--noturno);border-bottom:0;font-weight:700;
  background:var(--superficie);color:var(--noturno);
}
table.mapa tfoot .desc{background:var(--superficie)}
.cod-eap{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--acao);margin-right:8px}
.legenda{font-size:12.5px;color:var(--suave);margin-top:12px;display:flex;gap:18px;flex-wrap:wrap}
.legenda b{color:var(--ok)}

/* ── variação na série ── */
.d-sobe{color:var(--critico);font-weight:700}
.d-desce{color:var(--ok);font-weight:700}
.d-igual{color:var(--suave);font-weight:600}
.d-nulo{color:var(--linha)}
.d-sobe small,.d-desce small{font-weight:600;opacity:.8}
.variantes{
  font-size:12.5px;color:var(--suave);margin:-6px 0 12px;
  padding:7px 10px;background:var(--superficie);border:1px dashed var(--linha);border-radius:6px;
}

/* ── Liquid Glass ──
   Superfície translúcida com desfoque do que está atrás. O brilho da borda
   superior é o que dá a leitura de vidro: sem ele vira só um cinza claro. */
.vidro{
  background:linear-gradient(180deg, rgba(255,255,255,.78), rgba(255,255,255,.58));
  backdrop-filter:blur(22px) saturate(180%);
  -webkit-backdrop-filter:blur(22px) saturate(180%);
  border:1px solid rgba(255,255,255,.7);
  box-shadow:0 1px 0 rgba(255,255,255,.9) inset, 0 10px 34px -18px rgba(21,30,73,.45);
  border-radius:14px;
}
/* Campo derivado: mostra o valor sem fingir que é editável. */
.derivado{
  padding:10px 12px;font-size:14.5px;font-weight:600;color:var(--noturno);
  background:rgba(21,30,73,.045);border:1.5px solid transparent;border-radius:9px;
  min-height:43px;display:flex;align-items:center;
}

/* ── formulário da nova cotação ── */
.bloco{padding:20px 22px;margin-bottom:18px}
.bloco h2{
  margin:0 0 16px;font-size:12px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--royal);
}
.campos{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.campo label{display:block;font-size:12px;font-weight:600;color:var(--suave);margin-bottom:5px}
.campo input,.campo select,.campo textarea{
  width:100%;padding:10px 12px;font-size:14.5px;font-family:inherit;
  border:1.5px solid rgba(21,30,73,.14);border-radius:9px;
  /* Opaco de propósito: com fundo translúcido o contraste do que se digita
     passa a depender do gradiente atrás, ou seja, fica indeterminado. */
  background:#fff;color:var(--texto);
}
.campo input:focus,.campo select:focus,.campo textarea:focus{
  outline:none;border-color:var(--acao);background:#fff;
  box-shadow:0 0 0 3px rgba(6,92,169,.14);
}
.linha-prop{display:grid;grid-template-columns:1.6fr 1fr auto;gap:10px;margin-bottom:10px;align-items:end}
.bt{
  padding:9px 16px;font-size:14px;font-weight:600;font-family:inherit;
  border:1px solid rgba(21,30,73,.16);border-radius:9px;
  background:rgba(255,255,255,.8);color:var(--royal);cursor:pointer;
}
.bt:hover{background:#fff;border-color:var(--acao)}
.bt.primario{background:var(--royal);border-color:var(--royal);color:#fff}
.bt.primario:hover{background:var(--acao);border-color:var(--acao)}
.bt.some{color:var(--critico);border-color:rgba(176,48,36,.25)}
.bt:disabled{opacity:.45;cursor:default}
.acoes{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}

table.grade{width:100%;border-collapse:separate;border-spacing:0}
table.grade th{
  font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--suave);
  text-align:left;padding:0 8px 8px;border-bottom:1px solid rgba(21,30,73,.12);
}
table.grade td{padding:5px 4px;vertical-align:middle}
table.grade input,table.grade select{
  width:100%;padding:8px 10px;font-size:14px;font-family:inherit;
  border:1.5px solid rgba(21,30,73,.12);border-radius:8px;background:#fff;
}
table.grade input:focus,table.grade select:focus{
  outline:none;border-color:var(--acao);background:#fff;box-shadow:0 0 0 3px rgba(6,92,169,.12);
}
table.grade input.preco{text-align:right;font-variant-numeric:tabular-nums}
tr.eh-grupo input.desc{font-weight:700;color:var(--noturno);background:rgba(237,241,248,.85)}
.grade-rolo{overflow-x:auto}
.totais{
  display:flex;gap:20px;flex-wrap:wrap;margin-top:14px;padding-top:14px;
  border-top:1px solid rgba(21,30,73,.12);font-size:14px;
}
.totais b{color:var(--noturno);font-variant-numeric:tabular-nums}
@media(max-width:560px){ .linha-prop{grid-template-columns:1fr} }
</style>
</head>
<body>

<div class="barra">
  <div class="barra-in">
    <div class="marca-bloco">
      <div class="marca">Capital Realty &amp; Demercado</div>
      <div class="marca-nome">Capital Fornecedores</div>
    </div>
    <div class="abas" role="tablist">
      <button id="ab-consulta" role="tab" aria-selected="true"  onclick="aba('consulta')">Consulta de preço</button>
      <button id="ab-mapa"     role="tab" aria-selected="false" onclick="aba('mapa')">Equalizações</button>
    </div>
    <button id="ab-nova" class="bt primario" onclick="aba('nova')">+ Nova cotação</button>
  </div>
</div>

<div class="wrap">

  <h1 id="tituloTela">Consulta de preço</h1>
  <p class="sub" id="subTela">O que já pagamos por isso?</p>

  <section id="v-consulta">
    <div class="busca">
      <input id="q" type="search" placeholder="antena, mão de obra, sensor, cabo…" autocomplete="off">
      <button id="btn" onclick="buscar()">Consultar</button>
    </div>
    <div class="chips" id="chips"></div>

    <div id="painel"></div>
    <div id="saida"></div>
  </section>

  <section id="v-mapa" hidden>
    <div class="eq-sel">
      <select id="eqSel" onchange="abrirMapa(this.value)">
        <option value="">carregando equalizações…</option>
      </select>
    </div>
    <div id="mapa"></div>
  </section>

  <section id="v-nova" hidden>
    <div class="bloco vidro">
      <h2>A compra</h2>
      <div class="campos">
        <div class="campo">
          <label for="nEmp">Empreendimento</label>
          <select id="nEmp"><option value="">selecione o Mega…</option></select>
        </div>
        <div class="campo">
          <label>Empresa contratante</label>
          <div class="derivado" id="nEmpresa">escolha o Mega primeiro</div>
        </div>
        <div class="campo">
          <label for="nProjeto">Projeto</label>
          <input id="nProjeto" placeholder="META UTILITIES — PLANEJAMENTO E GESTÃO">
        </div>
        <div class="campo">
          <label for="nArea">Área</label>
          <input id="nArea" placeholder="Facilities, Equipamentos, Mão de obra…">
        </div>
        <div class="campo">
          <label for="nData">Data da equalização</label>
          <input id="nData" type="date">
        </div>
      </div>
    </div>

    <div class="bloco vidro">
      <h2>Proponentes</h2>
      <div id="props"></div>
      <div class="acoes">
        <button class="bt" onclick="addProponente()">+ Proponente</button>
      </div>
    </div>

    <div class="bloco vidro">
      <h2>Itens e preços</h2>
      <div class="grade-rolo"><table class="grade" id="grade"></table></div>
      <div class="acoes">
        <button class="bt" onclick="addItem('item')">+ Item</button>
        <button class="bt" onclick="addItem('grupo')">+ Grupo</button>
      </div>
      <div class="totais" id="totais"></div>
    </div>

    <div class="acoes">
      <button class="bt primario" id="btSalvar" onclick="salvarEqualizacao()">Salvar equalização</button>
      <span id="salvoMsg"></span>
    </div>
  </section>

  <footer id="rodape">carregando…</footer>
</div>

<script>
var moeda = function (v) {
  if (v === null || v === undefined) return '—';
  return 'R$ ' + Number(v).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
};
var esc = function (s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
};

function classeVariacao(p){ return p < 15 ? 'baixa' : (p < 60 ? 'media' : 'alta'); }

// Sinal antes do número: quem lê precisa ver "subiu" sem interpretar valor.
function delta(d) {
  if (!d) return '<span class="d-nulo">—</span>';
  if (d.sinal === '=') return '<span class="d-igual">= manteve</span>';
  var cls = d.sinal === '+' ? 'd-sobe' : 'd-desce';
  var pct = d.percentual === null || d.percentual === undefined
    ? '' : ' <small>(' + d.sinal + Math.abs(d.percentual).toFixed(1).replace('.', ',') + '%)</small>';
  return '<span class="' + cls + '">' + d.sinal + ' ' +
         moeda(Math.abs(d.absoluto)) + pct + '</span>';
}

// ── panorama ──
google.script.run.withSuccessHandler(function (p) {
  if (!p.ok) { document.getElementById('painel').innerHTML =
      '<div class="aviso erro">' + esc(p.erro) + '</div>'; return; }

  document.getElementById('painel').innerHTML =
    '<div class="painel">' +
      stat(p.precos, 'pontos de preço') +
      stat(p.equalizacoes, 'equalizações') +
      stat(p.fornecedores, 'fornecedores') +
      stat(p.empreendimentos, 'empreendimentos') +
      stat(p.pendencias, 'pendências') +
    '</div>' +
    (p.periodo ? '<p class="periodo">Cotações de ' + esc(p.periodo) + '</p>' : '');

  document.getElementById('chips').innerHTML = (p.sugestoes || []).map(function (s) {
    return '<span class="chip" onclick="buscar(this.textContent)">' + esc(s) + '</span>';
  }).join('');

  document.getElementById('rodape').textContent =
    'Capital Fornecedores · web ' + p.versao + ' · dados importados do acervo de equalizações';
}).apiPanorama();

function stat(n, r){ return '<div class="stat"><b>' + n + '</b><span>' + r + '</span></div>'; }

// ── busca ──
function buscar(termo) {
  var q = document.getElementById('q');
  if (termo) q.value = termo;
  var t = q.value.trim();
  if (!t) { q.focus(); return; }

  document.getElementById('btn').disabled = true;
  document.getElementById('saida').innerHTML = '<div class="carregando">consultando o histórico…</div>';

  google.script.run
    .withSuccessHandler(desenhar)
    .withFailureHandler(function (e) {
      document.getElementById('btn').disabled = false;
      document.getElementById('saida').innerHTML = '<div class="aviso erro">' + esc(e.message) + '</div>';
    })
    .apiConsultar(t);
}

document.getElementById('q').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') buscar();
});

function desenhar(r) {
  document.getElementById('btn').disabled = false;
  var el = document.getElementById('saida');

  if (!r.ok) { el.innerHTML = '<div class="aviso erro">' + esc(r.erro) + '</div>'; return; }
  if (!r.pontos) {
    el.innerHTML = '<div class="aviso">Nada encontrado para <b>' + esc(r.termo) + '</b>.' +
      ' A busca casa por palavra — tente um termo mais curto.</div>';
    return;
  }

  var html = '';

  r.grupos.forEach(function (g) {
    var linhas = g.precos.map(function (p, i) {
      var cls = g.precos.length > 1 && i === 0 ? 'menor'
              : (g.precos.length > 1 && i === g.precos.length - 1 ? 'maior' : '');
      var qtdUn = (p.quantidade !== null && p.quantidade !== undefined && p.quantidade !== '')
        ? esc(p.quantidade) + (p.unidade ? ' ' + esc(p.unidade) : '')
        : (p.unidade ? esc(p.unidade) : '—');
      return '<tr class="' + cls + '"><td>' + esc(p.fornecedor) +
             (p.fonte ? ' <a href="https://drive.google.com/file/d/' + esc(p.fonte) + '/view" target="_blank" class="fonte-link" title="Abrir fonte no Google Drive">📄</a>' : '') +
             (p.empresa ? '<span class="tag emp">' + esc(p.empresa) + '</span>' : '') +
             (p.situacao ? '<span class="tag ok">' + esc(p.situacao) + '</span>' : '') +
             (p.semCadastro ? '<span class="tag av">sem cadastro</span>' : '') +
             '</td><td class="un">' + qtdUn + '</td>' +
             '<td class="v">' + moeda(p.valor) + '</td></tr>';
    }).join('');

    var cabecalho = '<thead><tr>' +
      '<th>Fornecedor</th>' +
      '<th class="c" style="width:130px">Qtd / Unidade</th>' +
      '<th class="r" style="width:120px">Preço Cotado</th>' +
      '</tr></thead>';

    var meta = [g.empreendimento, g.area, g.data].filter(Boolean).map(esc).join(' · ');

    html += '<div class="item">' +
      '<h3><span class="cod">' + esc(g.codigo) + '</span>' + esc(g.descricao) + '</h3>' +
      '<div class="meta">' + meta + '</div>' +
      '<table>' + cabecalho + '<tbody>' + linhas + '</tbody></table>' +
      (g.precos.length > 1
        ? '<div class="faixa"><span>' + moeda(g.minimo) + ' a ' + moeda(g.maximo) + '</span>' +
          (g.variacao !== null && g.variacao !== undefined
            ? '<span class="var ' + classeVariacao(g.variacao) + '">' +
              Math.round(g.variacao) + '% entre o menor e o maior</span>' : '') +
          '</div>' +
          (g.minimo === null ? '<small class="filtrado">Sem preços comparáveis neste grupo</small>' : '')
        : '') +
      '</div>';
  });

  if (r.series && r.series.length) {
    r.series.forEach(function (s) {
      var linhas = s.ocorrencias.map(function (o) {
        return '<tr><td>' + esc(o.data) + ' · ' + esc(o.empreendimento) +
               '</td><td class="v">' + moeda(o.minimo) + '</td>' +
               '<td class="v">' + delta(o.vsAnterior) + '</td>' +
               '<td class="v">' + delta(o.vsPrimeira) + '</td></tr>';
      }).join('');

      var variantes = s.variantes
        ? '<div class="variantes">Agrupado como o mesmo item: ' +
          s.variantes.map(esc).join(' · ') + '</div>'
        : '';

      html += '<div class="serie"><h2>O mesmo item ao longo do tempo</h2>' +
              '<h3>' + esc(s.descricao) + '</h3>' + variantes + '<table>' +
              '<thead><tr><th>Período · Empreendimento</th>' +
              '<th class="r" style="width:110px">Menor Preço</th>' +
              '<th class="r" style="width:130px">vs. anterior</th>' +
              '<th class="r" style="width:130px">vs. primeira</th></tr></thead>' +
              '<tbody>' + linhas + '</tbody></table></div>';
    });
  } else if (r.grupos.length > 1) {
    html += '<div class="aviso">Estes são itens diferentes — não existe faixa única que faça' +
            ' sentido entre eles. A série de preço aparece quando o <b>mesmo</b> item voltar' +
            ' em outra equalização.</div>';
  }

  el.innerHTML = html;
}

// ─────────────────────────────────────────────────────────────
//  Mapa de equalização
// ─────────────────────────────────────────────────────────────

var equalizacoesCarregadas = false;

var TITULOS = {
  consulta: ['Consulta de preço', 'O que já pagamos por isso?'],
  mapa:     ['Equalizações', 'O comparativo lado a lado, item a item.'],
  nova:     ['Nova cotação', 'Uma linha por item, uma coluna por proponente.']
};

function aba(nome) {
  ['consulta', 'mapa', 'nova'].forEach(function (n) {
    document.getElementById('v-' + n).hidden = n !== nome;
  });

  // Só as duas de leitura são abas. "Nova cotação" é um editor, e por isso
  // é botão de ação: trocar entre leituras é reversível, sair de um
  // formulário com dado digitado não é.
  document.getElementById('ab-consulta').setAttribute('aria-selected', nome === 'consulta');
  document.getElementById('ab-mapa').setAttribute('aria-selected', nome === 'mapa');
  document.getElementById('ab-nova').classList.toggle('ativo', nome === 'nova');

  // O título da página diz onde se está — a barra é compacta demais para
  // carregar isso sozinha.
  document.getElementById('tituloTela').textContent = TITULOS[nome][0];
  document.getElementById('subTela').textContent = TITULOS[nome][1];

  // Carrega só quando a aba é aberta pela primeira vez.
  if (nome === 'mapa' && !equalizacoesCarregadas) {
    equalizacoesCarregadas = true;
    carregarEqualizacoes();
  }
  if (nome === 'nova' && !opcoesCarregadas) {
    opcoesCarregadas = true;
    carregarOpcoes();
  }
}

function carregarEqualizacoes() {
  google.script.run
    .withSuccessHandler(function (r) {
      var sel = document.getElementById('eqSel');
      if (!r.ok) {
        document.getElementById('mapa').innerHTML = '<div class="aviso erro">' + esc(r.erro) + '</div>';
        return;
      }
      if (!r.equalizacoes.length) {
        sel.innerHTML = '<option value="">nenhuma equalização na base</option>';
        document.getElementById('mapa').innerHTML =
          '<div class="aviso">A base ainda não tem equalizações. Os 21 orçamentos do acervo' +
          ' são propostas avulsas — aparecem na consulta de preço, não aqui.</div>';
        return;
      }
      sel.innerHTML = r.equalizacoes.map(function (e) {
        var rot = [e.data, e.empreendimento, e.area].filter(Boolean).join(' · ') +
                  ' (' + e.proponentes + ' proponentes)';
        return '<option value="' + esc(e.id) + '">' + esc(rot) + '</option>';
      }).join('');
      abrirMapa(r.equalizacoes[0].id);
    })
    .withFailureHandler(function (e) {
      document.getElementById('mapa').innerHTML = '<div class="aviso erro">' + esc(e.message) + '</div>';
    })
    .apiEqualizacoes();
}

function abrirMapa(id) {
  if (!id) return;
  document.getElementById('mapa').innerHTML = '<div class="carregando">montando o comparativo…</div>';
  google.script.run
    .withSuccessHandler(desenharMapa)
    .withFailureHandler(function (e) {
      document.getElementById('mapa').innerHTML = '<div class="aviso erro">' + esc(e.message) + '</div>';
    })
    .apiMapa(id);
}

function desenharMapa(m) {
  var el = document.getElementById('mapa');
  if (!m.ok) { el.innerHTML = '<div class="aviso erro">' + esc(m.erro) + '</div>'; return; }

  var eq = m.equalizacao;
  var props = m.proponentes;

  var cabecalho = '<tr><th class="desc">Item</th>' + props.map(function (p) {
    return '<th>' + esc(p.nome) +
           (p.rodada ? '<small>' + esc(p.rodada) + '</small>' : '') + '</th>';
  }).join('') + '</tr>';

  var corpo = m.linhas.map(function (l) {
    var recuo = 'padding-left:' + (14 + l.nivel * 18) + 'px';
    var qtd = (l.quantidade !== null && l.quantidade !== undefined && l.quantidade !== '')
      ? ' <span style="color:var(--suave);font-size:12.5px">(' + esc(l.quantidade) +
        (l.unidade ? ' ' + esc(l.unidade) : '') + ')</span>'
      : '';

    var celulas = props.map(function (p) {
      var c = l.precos[p.id];
      if (!c) return '<td class="preco vazio">·</td>';
      if (c.status !== 'cotado' || c.valor === null) {
        // "não cotou" é diferente de "cotou por zero" — e nunca vence a linha.
        return '<td class="preco nao">' + esc(rotuloStatus(c.status)) + '</td>';
      }
      // O ✓ não é enfeite: cor sozinha não comunica para quem tem
      // deuteranopia, e "qual é o menor" é a informação central do mapa.
      var eMenor = l.menor === p.id;
      return '<td class="preco' + (eMenor ? ' menor' : '') + '"' +
             (eMenor ? ' aria-label="menor preço da linha: ' + moeda(c.valor) + '"' : '') +
             '>' + (eMenor ? '✓ ' : '') + moeda(c.valor) + '</td>';
    }).join('');

    return '<tr class="' + (l.tipo === 'grupo' ? 'grupo' : '') + '">' +
           '<td class="desc" style="' + recuo + '">' +
           (l.codigo ? '<span class="cod-eap">' + esc(l.codigo) + '</span>' : '') +
           esc(l.descricao) + qtd + '</td>' + celulas + '</tr>';
  }).join('');

  // Duas linhas, não uma. O que o app cria não tem total declarado — só a
  // soma dos itens — e mostrar "—" apagava a conclusão da comparação. E
  // quando os dois existem, divergência entre o total que o fornecedor
  // escreveu e a soma real dos itens dele é erro comum de proposta.
  var temDeclarado = props.some(function (p) { return p.total !== null && p.total !== undefined; });

  var rodape =
    '<tr><td class="desc">Total dos itens</td>' + props.map(function (p) {
      return '<td class="preco">' + moeda(p.calculado) + '</td>';
    }).join('') + '</tr>' +
    (temDeclarado
      ? '<tr><td class="desc">Total declarado no documento</td>' + props.map(function (p) {
          var diverge = p.total !== null && p.calculado !== null &&
                        Math.abs(p.total - p.calculado) > 0.01;
          return '<td class="preco"' + (diverge ? ' style="color:var(--alerta)"' : '') + '>' +
                 moeda(p.total) + (diverge ? ' <small>≠ soma</small>' : '') + '</td>';
        }).join('') + '</tr>'
      : '');

  var meta = [eq.empreendimento, eq.projeto, eq.area, eq.data, eq.status].filter(Boolean).map(esc).join(' · ');

  var avisos = (m.pendencias || []).length
    ? '<div class="aviso" style="margin-bottom:16px"><b>' + m.pendencias.length +
      ' pendência(s) desta importação</b> — mudam como o comparativo deve ser lido:<ul style="margin:8px 0 0;padding-left:18px">' +
      m.pendencias.slice(0, 6).map(function (p) { return '<li>' + esc(p.descricao) + '</li>'; }).join('') +
      '</ul></div>'
    : '';

  el.innerHTML =
    '<div class="eq-cab"><h2>' + esc(eq.projeto || eq.id) + '</h2>' +
    '<div class="meta">' + meta + '</div></div>' +
    avisos +
    '<div class="mapa-rolo"><table class="mapa">' +
      '<thead>' + cabecalho + '</thead>' +
      '<tbody>' + corpo + '</tbody>' +
      '<tfoot>' + rodape + '</tfoot>' +
    '</table></div>' +
    '<div class="legenda"><span><b>verde</b> = menor preço da linha, entre quem cotou</span>' +
    '<span>· = fornecedor não recebeu esta linha</span></div>';
}

function rotuloStatus(s) {
  if (s === 'incluso_em_outro_item') return 'incluso';
  if (s === 'excluido') return 'excluído';
  if (s === 'nao_aplicavel') return 'n/a';
  return 'não cotou';
}

// ─────────────────────────────────────────────────────────────
//  Nova cotação
// ─────────────────────────────────────────────────────────────

var opcoesCarregadas = false;
var proponentes = [];
var itens = [];

function carregarOpcoes() {
  google.script.run.withSuccessHandler(function (r) {
    if (!r.ok) return;
    document.getElementById('nEmp').innerHTML =
      '<option value="">selecione o Mega…</option>' +
      r.empreendimentos.map(function (e) {
        return '<option value="' + esc(e.nome) + '" data-empresa="' + esc(e.empresa) + '">' +
               esc(e.nome) + '</option>';
      }).join('');
    document.getElementById('nEmp').onchange = mostrarEmpresa;
  }).apiOpcoes();

  document.getElementById('nData').valueAsDate = new Date();
  addProponente(); addProponente(); addProponente();   // três é o mínimo usual
  addItem('grupo'); addItem('item');
}

/**
 * A contratante sai do Mega: Curitiba é Demercado, Esteio e Itajaí são
 * Capital Realty. A relação é fixa, então escolher à mão seria só um
 * campo a mais para preencher errado. O servidor deriva de novo por conta
 * própria e ignora o que a tela mandar.
 */
function mostrarEmpresa() {
  var sel = document.getElementById('nEmp');
  var op = sel.options[sel.selectedIndex];
  var nome = op ? op.getAttribute('data-empresa') : '';
  document.getElementById('nEmpresa').textContent = nome || 'escolha o Mega primeiro';
}

function addProponente() {
  proponentes.push({ nome: '', cnpj: '' });
  itens.forEach(function (i) { i.precos.push(''); });
  desenharProponentes(); desenharGrade();
}

function removerProponente(i) {
  proponentes.splice(i, 1);
  itens.forEach(function (it) { it.precos.splice(i, 1); });
  desenharProponentes(); desenharGrade();
}

function desenharProponentes() {
  document.getElementById('props').innerHTML = proponentes.map(function (p, i) {
    return '<div class="linha-prop">' +
      '<div class="campo"><label>Proponente ' + (i + 1) + '</label>' +
      '<input value="' + esc(p.nome) + '" placeholder="razão social"' +
      ' oninput="proponentes[' + i + '].nome=this.value"></div>' +
      '<div class="campo"><label>CNPJ</label>' +
      '<input value="' + esc(p.cnpj) + '" placeholder="00.000.000/0001-00"' +
      ' oninput="proponentes[' + i + '].cnpj=this.value"></div>' +
      '<button class="bt some" onclick="removerProponente(' + i + ')" ' +
      (proponentes.length < 2 ? 'disabled' : '') + '>remover</button>' +
      '</div>';
  }).join('');
}

function addItem(tipo) {
  itens.push({
    tipo: tipo, nivel: tipo === 'grupo' ? 0 : 1, descricao: '',
    quantidade: '', unidade: '',
    precos: proponentes.map(function () { return ''; })
  });
  desenharGrade();
}

function removerItem(i) { itens.splice(i, 1); desenharGrade(); }

function desenharGrade() {
  var cab = '<thead><tr><th style="width:44px">Nív.</th><th>Descrição</th>' +
    '<th style="width:90px">Qtd</th><th style="width:90px">Un.</th>' +
    proponentes.map(function (p, i) {
      return '<th style="width:130px">' + esc(p.nome || ('Proponente ' + (i + 1))) + '</th>';
    }).join('') + '<th style="width:40px"></th></tr></thead>';

  var corpo = itens.map(function (it, i) {
    var precos = it.tipo === 'grupo'
      // Grupo agrega e não recebe preço: gravar aqui contaria duas vezes.
      ? proponentes.map(function () { return '<td></td>'; }).join('')
      : proponentes.map(function (p, j) {
          return '<td><input class="preco" inputmode="decimal" value="' + esc(it.precos[j]) + '"' +
                 ' placeholder="—"' +
                 ' aria-label="Preço unitário — ' + esc(it.descricao || ('item ' + (i + 1))) +
                 ' — ' + esc(p.nome || ('proponente ' + (j + 1))) + '"' +
                 ' oninput="itens[' + i + '].precos[' + j + ']=this.value;calcular()"' +
                 ' onblur="normalizarCampo(this,' + i + ',' + j + ')"></td>';
        }).join('');

    var niveis = [0, 1, 2, 3].map(function (n) {
      return '<option value="' + n + '"' + (it.nivel === n ? ' selected' : '') + '>' + n + '</option>';
    }).join('');

    return '<tr class="' + (it.tipo === 'grupo' ? 'eh-grupo' : '') + '">' +
      '<td><select onchange="itens[' + i + '].nivel=Number(this.value)">' + niveis + '</select></td>' +
      '<td><input class="desc" value="' + esc(it.descricao) + '" placeholder="' +
        (it.tipo === 'grupo' ? 'NOME DO GRUPO' : 'descrição do item') +
        '" oninput="itens[' + i + '].descricao=this.value"></td>' +
      '<td><input value="' + esc(it.quantidade) + '" inputmode="decimal"' +
        ' oninput="itens[' + i + '].quantidade=this.value;calcular()"></td>' +
      '<td><input value="' + esc(it.unidade) + '" placeholder="un"' +
        ' oninput="itens[' + i + '].unidade=this.value"></td>' +
      precos +
      '<td><button class="bt some" style="padding:6px 9px" onclick="removerItem(' + i + ')">×</button></td>' +
      '</tr>';
  }).join('');

  document.getElementById('grade').innerHTML = cab + '<tbody>' + corpo + '</tbody>';
  calcular();
}

/**
 * MESMA regra de cfNumero_ (Util.gs). Não simplifique.
 *
 * A versão anterior apagava todo ponto, e o servidor não. Digitar "12.500"
 * mostrava R$ 12.500,00 na tela e gravava 12,5 na planilha — sem erro, sem
 * aviso. Divergência entre o que a tela soma e o que o servidor grava é o
 * defeito mais caro possível num sistema de preço.
 *
 * O teste "Correção 15" extrai esta função do HTML e compara com cfNumero_.
 */
function num(v) {
  if (v === null || v === undefined || v === '') return null;
  if (typeof v === 'number') return isNaN(v) ? null : v;

  var s = String(v).trim()
    .replace(/R\$/gi, '')
    .replace(/\s/g, '')
    .replace(/[()]/g, '');

  if (!s || /^[-–—]$/.test(s)) return null;

  var temVirgula = s.indexOf(',') >= 0;
  var temPonto = s.indexOf('.') >= 0;
  if (temVirgula && temPonto) {
    s = s.lastIndexOf(',') > s.lastIndexOf('.')
      ? s.replace(/\./g, '').replace(',', '.')
      : s.replace(/,/g, '');
  } else if (temVirgula) {
    s = s.replace(',', '.');
  }

  var n = Number(s);
  return isNaN(n) ? null : n;
}

/**
 * Reescreve o campo no formato BR ao sair dele.
 * É a única defesa real contra erro de digitação de valor: o comprador vê
 * como o sistema entendeu ANTES de salvar, em vez de descobrir no mapa.
 */
function normalizarCampo(el, i, j) {
  var n = num(el.value);
  if (n === null) { el.value = ''; itens[i].precos[j] = ''; calcular(); return; }
  el.value = n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  itens[i].precos[j] = el.value;
  calcular();
}

function calcular() {
  var totais = proponentes.map(function () { return 0; });
  var cotou = proponentes.map(function () { return 0; });
  var itensReais = itens.filter(function (i) { return i.tipo !== 'grupo'; }).length;

  itens.forEach(function (it) {
    if (it.tipo === 'grupo') return;
    var q = num(it.quantidade);
    it.precos.forEach(function (p, j) {
      var v = num(p);
      if (v === null) return;
      totais[j] += v * (q === null ? 1 : q);
      cotou[j] += 1;
    });
  });

  var menor = null;
  totais.forEach(function (t, j) {
    if (cotou[j] === 0) return;
    if (menor === null || t < totais[menor]) menor = j;
  });

  document.getElementById('totais').innerHTML = proponentes.map(function (p, j) {
    // A cesta incompleta aparece junto do total: o mais barato pode ser
    // só o que deixou item sem cotar.
    var falta = itensReais - cotou[j];
    return '<span>' + esc(p.nome || ('Proponente ' + (j + 1))) + ': <b' +
      (menor === j ? ' style="color:var(--ok)"' : '') + '>' + moeda(totais[j]) + '</b>' +
      (falta > 0 ? ' <small style="color:var(--alerta)">(' + falta + ' sem cotar)</small>' : '') +
      '</span>';
  }).join('');
}

/** Leva ao mapa da equalização recém-criada: é o fecho natural da tarefa. */
function verMapaDe(id) {
  aba('mapa');
  google.script.run.withSuccessHandler(function (r) {
    if (!r.ok) return;
    var sel = document.getElementById('eqSel');
    sel.innerHTML = r.equalizacoes.map(function (e) {
      var rot = [e.data, e.empreendimento, e.area].filter(Boolean).join(' · ') +
                ' (' + e.proponentes + ' proponentes)';
      return '<option value="' + esc(e.id) + '">' + esc(rot) + '</option>';
    }).join('');
    sel.value = id;
    equalizacoesCarregadas = true;
    abrirMapa(id);
  }).apiEqualizacoes();
}

function salvarEqualizacao() {
  var bt = document.getElementById('btSalvar');
  var msg = document.getElementById('salvoMsg');
  bt.disabled = true;
  msg.innerHTML = 'gravando…';

  google.script.run
    .withSuccessHandler(function (r) {
      if (!r.ok) {
        bt.disabled = false;   // só reabilita quando falhou: dá para tentar de novo
        msg.innerHTML = '<span style="color:var(--critico)">' + esc(r.erro) + '</span>';
        return;
      }
      // Continua desabilitado de propósito. Reabilitar com o formulário
      // intacto fazia dois cliques criarem duas equalizações idênticas —
      // não há chave de idempotência no servidor que segure isso.
      msg.innerHTML = '<span style="color:var(--ok)">Gravada ' + esc(r.resultado.id) + ' · ' +
        r.resultado.nos + ' nós · ' + r.resultado.precos + ' preços.</span> ' +
        '<button class="bt" onclick="verMapaDe(\'' + esc(r.resultado.id) + '\')">Abrir o mapa</button> ' +
        '<button class="bt" onclick="location.reload()">Nova equalização</button>';
      equalizacoesCarregadas = false;   // o seletor do mapa precisa recarregar
    })
    .withFailureHandler(function (e) {
      bt.disabled = false;
      msg.innerHTML = '<span style="color:var(--critico)">' + esc(e.message) + '</span>';
    })
    .apiCriarEqualizacao({
      empreendimento: document.getElementById('nEmp').value,
      projeto: document.getElementById('nProjeto').value,
      area: document.getElementById('nArea').value,
      data: document.getElementById('nData').value,
      proponentes: proponentes,
      itens: itens
    });
}
